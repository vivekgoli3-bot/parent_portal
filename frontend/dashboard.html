<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="bg-light">

<!-- 🔹 NAVBAR -->
<nav class="navbar navbar-dark bg-primary px-3">
  <span class="navbar-brand">Parent Portal</span>
  <button class="btn btn-light btn-sm" onclick="logout()">Logout</button>
</nav>

<div class="container mt-4">

  <!-- 🔹 STUDENT PROFILE -->
  <div class="card p-3 shadow mb-4">
    <h4>Student Profile</h4>
    <p><strong>Name:</strong> <span id="studentName">-</span></p>
    <p><strong>Class:</strong> <span id="studentClass">-</span></p>
    <p><strong>Section:</strong> <span id="studentSection">-</span></p>
  </div>

  <!-- 🔹 CARDS -->
  <div class="row">

    <!-- Attendance -->
    <div class="col-md-6 mb-3">
      <div class="card p-3 shadow">
        <h5>Attendance</h5>
        <span id="attendanceBadge" class="badge bg-success mb-2">0%</span>
        <canvas id="attendanceChart"></canvas>
      </div>
    </div>

    <!-- Marks -->
    <div class="col-md-6 mb-3">
      <div class="card p-3 shadow">
        <h5>Marks</h5>
        <canvas id="marksChart"></canvas>
      </div>
    </div>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="script.js"></script>

</body>
</html>
