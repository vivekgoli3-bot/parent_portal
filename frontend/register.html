<!DOCTYPE html>
<html>
<head>
  <title>Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card p-4 shadow" style="width: 350px;">
    
    <h3 class="text-center mb-3">Create Account</h3>

    <form id="registerForm">
  <input type="text" id="name" placeholder="Name" required />
  <input type="email" id="email" placeholder="Email" required />
  <input type="text" id="otp" placeholder="Enter OTP" required />
<button type="button" onclick="sendOtp()">Send OTP</button>
  <input type="password" id="password" placeholder="Password" required />

  <input type="text" id="usn" placeholder="USN" required />
  <input type="text" id="className" placeholder="Class (BCA)" required />
  <input type="text" id="section" placeholder="Section" required />

  <button>Register</button>
</form>
    <p class="text-center mt-2">
      Already have account? <a href="index.html">Login</a>
    </p>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
