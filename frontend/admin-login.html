<!DOCTYPE html>
<html>
<head>
  <title>Admin Login</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body class="landing-body">

<main class="auth-shell">
  <section class="hero-panel">
    <p class="eyebrow">Parent Portal</p>
    <h1>Admin access for academic operations.</h1>
    <p class="hero-copy">
      Manage students, classes, marks, and attendance from one clean workspace.
    </p>
    <a class="text-link" href="index.html">Back to portal home</a>
  </section>

  <section class="auth-panel">
    <div class="glass-card auth-card">
      <h2>Admin Login</h2>
      <p class="subtle-text">Use your admin credentials to continue.</p>

      <form id="adminLoginForm" class="stack-form">
        <label>
          <span>Email</span>
          <input id="adminEmail" type="email" placeholder="admin@school.com" required>
        </label>
        <label>
          <span>Password</span>
          <input id="adminPassword" type="password" placeholder="Enter password" required>
        </label>
        <button type="submit">Login to Admin Panel</button>
      </form>

      <p id="authMessage" class="status-message" aria-live="polite"></p>
    </div>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
