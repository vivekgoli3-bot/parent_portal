<!DOCTYPE html>
<html>
<head>
  <title>Admin Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="navbar">
  <h3>Admin Panel</h3>
  <button onclick="logout()">Logout</button>
</div>

<div class="sidebar">
  <a href="#">Dashboard</a>
  <a href="#">Students</a>
  <a href="#">Marks</a>
  <a href="#">Attendance</a>
</div>

<div class="main">

  <div class="card">
    <h3>Subjects</h3>
    <input id="classSub" placeholder="Class">
    <input id="subjectsInput" placeholder="Subjects">
    <button onclick="saveSubjects()">Save</button>
  </div>

  <div class="card">
    <h3>Create Student</h3>
    <input id="name" placeholder="Name">
    <input id="email" placeholder="Email">
    <input id="password" placeholder="Password">
    <input id="usn" placeholder="USN">
    <input id="className" placeholder="Class">
    <input id="section" placeholder="Section">
    <button onclick="createStudent()">Create</button>
  </div>

  <div class="card">
    <h3>Marks</h3>
    <select id="studentDropdown"></select>
    <input id="classFetch" placeholder="Class">
    <button onclick="loadSubjects()">Load Subjects</button>
    <div id="subjectsUI"></div>
    <button onclick="saveMarks()">Save Marks</button>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
