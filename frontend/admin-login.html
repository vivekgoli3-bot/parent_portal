<!DOCTYPE html>
<html>
<head>
  <title>Admin Login</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body class="landing-body">

<main class="auth-shell">
  <section class="hero-panel">
    <p class="eyebrow">ERP access</p>
    <h1>Control academics, operations, and records from one suite.</h1>
    <p class="hero-copy">
      Admissions, curriculum management, marks, attendance, and student records now live in a cleaner ERP-style admin workspace.
    </p>
    <a class="text-link" href="index.html">Back to portal home</a>
  </section>

  <section class="auth-panel">
    <div class="glass-card auth-card">
      <h2>Admin ERP Login</h2>
      <p class="subtle-text">Use your admin credentials to access operational controls.</p>

      <form id="adminLoginForm" class="stack-form">
        <label>
          <span>Email</span>
          <input id="adminEmail" type="email" placeholder="admin@school.com" required>
        </label>
        <label>
          <span>Password</span>
          <input id="adminPassword" type="password" placeholder="Enter password" required>
        </label>
        <button type="submit">Login to Admin Panel</button>
      </form>

      <p id="authMessage" class="status-message" aria-live="polite"></p>
    </div>
  </section>
</main>

<script src="runtime-warning.js"></script>
<script type="module" src="script.js"></script>
</body>
</html>
