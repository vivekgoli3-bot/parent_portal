<!DOCTYPE html>
<html>
<head>
  <title>Student Login</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body class="landing-body">

<main class="auth-shell">
  <section class="hero-panel">
    <p class="eyebrow">Student Access</p>
    <h1>Track marks and attendance in one place.</h1>
    <p class="hero-copy">
      Parents can quickly review academic progress, attendance trends, and class details.
    </p>
    <a class="text-link" href="admin-login.html">Admin login</a>
  </section>

  <section class="auth-panel">
    <div class="glass-card auth-card">
      <h2>Student Login</h2>
      <p class="subtle-text">Sign in with the parent account linked to your student.</p>

      <form id="studentLoginForm" class="stack-form">
        <label>
          <span>Email</span>
          <input id="studentEmail" type="email" placeholder="parent@example.com" required>
        </label>
        <label>
          <span>Password</span>
          <input id="studentPassword" type="password" placeholder="Enter password" required>
        </label>
        <button type="submit">Open Dashboard</button>
      </form>

      <p id="authMessage" class="status-message" aria-live="polite"></p>
    </div>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
