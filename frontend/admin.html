<link rel="stylesheet" href="style.css">

<div class="navbar">Admin Panel</div>

<div class="container">

<!-- CREATE SUBJECTS -->
<div class="card">
<h3>Subjects (per class)</h3>
<input id="classSub" placeholder="Class (10A)">
<input id="subjectsInput" placeholder="Math,Science,English">
<button onclick="saveSubjects()">Save</button>
</div>

<!-- CREATE STUDENT -->
<div class="card">
<h3>Create Student</h3>
<input id="name">
<input id="email">
<input id="password">
<input id="usn">
<input id="className">
<input id="section">
<button onclick="createStudent()">Create</button>
</div>

<!-- ADD MARKS -->
<div class="card">
<h3>Add / Edit Marks</h3>
<input id="studentId">
<input id="classFetch" placeholder="Class">
<button onclick="loadSubjects()">Load Subjects</button>

<div id="subjectsUI"></div>

<button onclick="saveMarks()">Save Marks</button>
</div>

</div>

<script src="script.js"></script>
